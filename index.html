<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IuranKu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: #ffffff;
      padding: 22px 18px;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #16a34a;
    }

    .subtitle {
      margin-top: 5px;
      color: #64748b;
      font-size: 14px;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .perumahan {
      color: #52749f;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .rumah {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 32px;
    }

    .label {
      color: #64748b;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .bulan {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .jumlah {
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .status {
      padding: 22px;
      border-radius: 16px;
      background: #fff1f2;
      color: #ef233c;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 20px;
      background: #16a34a;
      color: white;
      font-size: 23px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:hover {
      background: #15803d;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      font-size: 18px;
      color: #64748b;
    }

    .error {
      background: #fff1f2;
      color: #be123c;
      padding: 20px;
      border-radius: 16px;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      padding: 30px 15px;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 28px 22px;
      }

      .rumah {
        font-size: 32px;
      }

      .bulan {
        font-size: 24px;
      }

      .jumlah {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">IuranKu</div>
    <div class="subtitle">
      Portal pembayaran iuran warga
    </div>
  </div>

  <div class="container">

    <div id="loading" class="loading">
      Memuat data...
    </div>

    <div id="error" class="error" style="display:none;">
      Terjadi kesalahan saat mengambil data.
    </div>

    <div id="content" class="card" style="display:none;">

      <div class="perumahan" id="perumahan">
        -
      </div>

      <div class="rumah" id="rumah">
        -
      </div>

      <div class="label">
        Tagihan
      </div>

      <div class="bulan" id="bulan">
        -
      </div>

      <div class="jumlah" id="jumlah">
        Rp 0
      </div>

      <div class="status" id="status">
        ❌ Belum Bayar
      </div>

      <button class="button" onclick="bayar()">
        Bayar Sekarang
      </button>

    </div>

  </div>

  <div class="footer">
    IuranKu © 2026
  </div>


  <script>

    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://uwdoblfybrmdtidvgmsj.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable__yv9ABPvloo5fGTbC0I25g_j6yK15sI";


    /* =====================================================
       FORMAT RUPIAH
       ===================================================== */

    function rupiah(angka) {

      return new Intl.NumberFormat(
        "id-ID",
        {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 0
        }
      ).format(Number(angka || 0));

    }


    /* =====================================================
       NAMA BULAN
       ===================================================== */

    const namaBulanIndonesia = [
      "Januari",
      "Februari",
      "Maret",
      "April",
      "Mei",
      "Juni",
      "Juli",
      "Agustus",
      "September",
      "Oktober",
      "November",
      "Desember"
    ];


    /* =====================================================
       AMBIL TOKEN DARI URL
       ===================================================== */

    function ambilToken() {

      const params =
        new URLSearchParams(window.location.search);

      return params.get("token");

    }


    /* =====================================================
       LOAD DATA
       ===================================================== */

    async function loadData() {

      try {

        const token = ambilToken();

        if (!token) {

          throw new Error(
            "Token rumah tidak ditemukan."
          );

        }


        /* -----------------------------------------------
           1. AMBIL DATA RUMAH
           ----------------------------------------------- */

        const rumahResponse =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/rumah" +
            "?token_qr=eq." +
            encodeURIComponent(token) +
            "&select=*,rt:rt_id(" +
            "perumahan_id," +
            "nomor_rt," +
            "nama_ketua," +
            "perumahan:perumahan_id(" +
            "nama," +
            "alamat," +
            "rekening," +
            "qris_url," +
            "nominal_iuran" +
            ")" +
            ")",
            {
              headers: {
                "apikey":
                  SUPABASE_ANON_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_ANON_KEY
              }
            }
          );


        if (!rumahResponse.ok) {

          throw new Error(
            "Gagal mengambil data rumah."
          );

        }


        const rumahData =
          await rumahResponse.json();


        if (!rumahData.length) {

          throw new Error(
            "Rumah tidak ditemukan."
          );

        }


        const rumah =
          rumahData[0];


        const perumahan =
          rumah.rt &&
          rumah.rt.perumahan;


        /* -----------------------------------------------
           2. TAMPILKAN DATA RUMAH
           ----------------------------------------------- */

        document.getElementById(
          "perumahan"
        ).textContent =
          perumahan?.nama ||
          "Perumahan";


        document.getElementById(
          "rumah"
        ).textContent =
          "Rumah: Blok " +
          rumah.blok +
          " - " +
          rumah.nomor_rumah;


        /* -----------------------------------------------
           3. TENTUKAN BULAN SEKARANG
           ----------------------------------------------- */

        const sekarang =
          new Date();

        const bulanSekarang =
          sekarang.getMonth() + 1;

        const tahunSekarang =
          sekarang.getFullYear();


        const namaBulan =
          namaBulanIndonesia[
            bulanSekarang - 1
          ];


        document.getElementById(
          "bulan"
        ).textContent =
          "Iuran " +
          namaBulan +
          " " +
          tahunSekarang;


        /* -----------------------------------------------
           4. AMBIL TAGIHAN RUMAH
           ----------------------------------------------- */

        const tagihanResponse =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/tagihan" +
            "?rumah_id=eq." +
            encodeURIComponent(
              rumah.id
            ) +
            "&bulan=eq." +
            bulanSekarang +
            "&tahun=eq." +
            tahunSekarang +
            "&select=*",
            {
              headers: {

                "apikey":
                  SUPABASE_ANON_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_ANON_KEY

              }
            }
          );


        if (!tagihanResponse.ok) {

          throw new Error(
            "Gagal mengambil data tagihan."
          );

        }


        const tagihanData =
          await tagihanResponse.json();


        /* -----------------------------------------------
           5. TAMPILKAN NOMINAL TAGIHAN
           ----------------------------------------------- */

        if (tagihanData.length > 0) {

          const tagihan =
            tagihanData[0];


          document.getElementById(
            "jumlah"
          ).textContent =
            rupiah(
              tagihan.nominal
            );


          const status =
            tagihan.status ||
            "Belum Bayar";


          if (
            status
              .toLowerCase()
              .includes("lunas")
          ) {

            document.getElementById(
              "status"
            ).textContent =
              "✅ " + status;

            document.getElementById(
              "status"
            ).style.background =
              "#ecfdf5";

            document.getElementById(
              "status"
            ).style.color =
              "#16a34a";

          } else {

            document.getElementById(
              "status"
            ).textContent =
              "❌ " + status;

          }

        } else {

          document.getElementById(
            "jumlah"
          ).textContent =
            rupiah(0);


          document.getElementById(
            "status"
          ).textContent =
            "Tidak ada tagihan";

        }


        /* -----------------------------------------------
           6. TAMPILKAN HALAMAN
           ----------------------------------------------- */

        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "content"
        ).style.display =
          "block";

      }


      catch (error) {

        console.error(error);


        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "error"
        ).style.display =
          "block";


        document.getElementById(
          "error"
        ).textContent =
          "Terjadi kesalahan: " +
          error.message;

      }

    }


    /* =====================================================
       TOMBOL BAYAR
       ===================================================== */

    function bayar() {

  alert(
    "PEMBAYARAN IURAN\n\n" +
    "Silakan transfer ke rekening berikut:\n\n" +
    "BANK BJB\n" +
    "No. Rekening: 0099457058100\n\n" +
    "Setelah melakukan transfer,\n" +
    "silakan simpan bukti pembayaran.\n\n" +
    "Fitur upload bukti pembayaran\n" +
    "akan kita tambahkan berikutnya."
  );

}


    /* =====================================================
       JALANKAN
       ===================================================== */

    loadData();

  </script>

</body>
</html>
